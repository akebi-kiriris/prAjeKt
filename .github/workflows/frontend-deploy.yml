name: Frontend Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: Build
      run: |
        cd frontend
        npm run build

    - name: Deploy to Firebase Hosting
      env:
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      shell: bash
      run: |
        npm install -g firebase-tools
        set +e
        firebase deploy --token "$FIREBASE_TOKEN" --project prajekt-kiriris --only hosting 2>&1 | tee firebase-deploy.log
        status=${PIPESTATUS[0]}
        set -e

        if [ "$status" -eq 0 ]; then
          exit 0
        fi

        if grep -q "is the current active version" firebase-deploy.log; then
          echo "Firebase Hosting already points to this version; treating duplicate release as success."
          exit 0
        fi

        exit "$status"
